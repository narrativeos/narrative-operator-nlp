# ───────────────────────────────────────────────────────────────
# Narrative Operator NLP — Docker Compose
# ───────────────────────────────────────────────────────────────
# Configuration: copy .env.example → .env and customize.
#
# Usage:
#   docker compose up -d              # Start (FastAPI + gRPC in one container)
#   docker compose up -d --build      # Rebuild and start
#
# Access:
#   Demo 页面 (交互式可视化 + API 接口说明):
#     http://localhost:8000/demo
#   Swagger UI (自动生成 API 文档):
#     http://localhost:8000/docs
#   ReDoc:
#     http://localhost:8000/redoc
#   OpenAPI JSON Schema:
#     http://localhost:8000/openapi.json
#
# Available Endpoints:
#   GET  /              → 重定向到 /demo
#   GET  /health        → 健康检查
#   POST /analyze       → NLP 分析主端点 (NSP 标准化结果)
#   POST /analyze/dep   → 依存句法分析 (SVG 渲染用)
#   POST /analyze/discover → 新词发现 (PMI + ConvSeg)
#   POST /analyze/pretty   → HanLP 原生可视化 (to_pretty)
#
# MCP (Model Context Protocol) uses stdio transport and is designed
# for local subprocess invocation, not Docker networking.
# For LLM/Agent integration in Docker, use the HTTP API instead:
#   curl -X POST http://localhost:8000/analyze \
#     -H "Content-Type: application/json" \
#     -d '{"text":"碳钢是钢的一种，具有高强度。"}'
# ───────────────────────────────────────────────────────────────

volumes:
  hanlp-models:
    name: narrative-operator-nlp-models

services:
  # ── Single container: FastAPI (HTTP) + gRPC ────────────────
  narrative-nlp:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: narrative-operator-nlp:latest
    container_name: narrative-nlp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    ports:
      - "${HTTP_PORT:-8000}:8000"       # FastAPI + Demo (含 API 接口说明)
    volumes:
      - hanlp-models:/root/.hanlp
    command: ["both"]                    # FastAPI foreground + gRPC background
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # For remote Worker Runtime, set GRPC_PORT=50051 and connect via TCP.
    # Default uses Unix Domain Socket for local-only zero-overhead IPC.
    # When Worker Runtime is in same compose network, use:
    #   GRPC_SOCKET=/tmp/narrative-operator-nlp.sock
