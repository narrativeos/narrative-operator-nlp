name: Publish Python Package

on:
  push:
    tags: [ 'v0.*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (e.g. v0.1.2)'
        required: true
        default: 'main'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build distributions
        run: |
          python -m pip install --upgrade build grpcio-tools
          python -m grpc_tools.protoc -I schemas --python_out=schemas --grpc_python_out=schemas schemas/narrative.proto
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
