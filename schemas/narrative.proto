// Narrative Schema Protocol (NSP) — Protobuf Contract
//
// Defines the gRPC service and message types for narrative-operator-nlp.
// This contract MUST stay semantically aligned with core/schema.py and
// schemas/narrative.schema.json.

syntax = "proto3";

package narrative.nlp.v1;

option go_package = "github.com/narrativeos/narrative-operator-nlp/schemas/nlp/v1;nlpv1";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service NarrativeService {
  // Analyze text and return NSP-standardized narrative atoms.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------

message AnalyzeRequest {
  // Raw text to analyze.
  string text = 1;
  // Optional: NLP engine identifier (default: "hanlp_v2").
  string source = 2;
}

message AnalyzeResponse {
  NarrativeMeta meta = 1;
  NarrativeContent content = 2;
}

message NarrativeMeta {
  string source = 1;       // e.g. "hanlp_v2"
  string version = 2;      // NSP schema version
  string timestamp = 3;    // ISO 8601
  int32 text_length = 4;   // Original text character count
}

message NarrativeContent {
  repeated Token tokens = 1;
  repeated Entity entities = 2;
  repeated Relation relations = 3;
  repeated Event events = 5;
  // Raw NLP engine output (JSON string, for debugging).
  string structural_json = 4;
  // Generated title of the document (optional).
  Title title = 6;
}

// ---------------------------------------------------------------------------
// Token
// ---------------------------------------------------------------------------

message Token {
  int32 id = 1;            // Sequential index from 0
  string text = 2;         // Token text
  string pos = 3;          // Universal POS tag
  Span span = 4;           // Character offset
}

message Span {
  int32 start = 1;         // Inclusive start
  int32 end = 2;           // Exclusive end
}

// ---------------------------------------------------------------------------
// Entity
// ---------------------------------------------------------------------------

message Entity {
  string id = 1;           // e.g. "ent_001"
  string text = 2;         // Surface text
  string category = 3;     // NSP entity category
  Span span = 4;           // Character offset
  string normalized = 5;   // Canonical form
  string source = 6;       // Source NER model
  float confidence = 7;    // [0, 1]
}

// ---------------------------------------------------------------------------
// Relation
// ---------------------------------------------------------------------------

message Relation {
  string id = 1;              // e.g. "rel_001"
  string subject = 2;         // Subject text
  string subject_ent_id = 3;  // Linked entity (optional)
  string predicate = 4;       // NSP relation type
  string object = 5;          // Object text
  string object_ent_id = 6;   // Linked entity (optional)
  string evidence = 7;        // Original text fragment
  Span evidence_span = 8;     // Evidence offset
  float confidence = 9;       // [0, 1]
  string source = 10;         // Extraction source
}

// ---------------------------------------------------------------------------
// Event
// ---------------------------------------------------------------------------

message EventArgument {
  string role = 1;            // e.g. Agent, Patient, Time, Location
  string text = 2;            // Argument surface text
  string entity_id = 3;       // Linked entity ID (optional)
  Span span = 4;              // Character offset
  // Syntactic dimensions (Step 4)
  string syntactic_role = 5;  // Subject, Object, Adverbial, Attributive
  string governing_verb = 6;  // First V-head ancestor in dependency tree
  Span token_span = 7;       // Token index range [start, end)
  // Spatial dimensions (Step 4b)
  string spatial_role = 8;       // CONTAINER, TARGET, ORIGIN, PATH, ACTOR, MODIFIER, STATIC
  string verb_spatial_class = 9; // MOVE_TO, MOVE_FROM, MOVE_ALONG, STATIC_EXIST, STATIC_ACTION, VIEW, NONE
}

message Event {
  string id = 1;              // e.g. "evt_001"
  string event_type = 2;      // Derived from trigger verb (no fixed taxonomy)
  string trigger = 3;         // Event trigger word
  Span trigger_span = 4;      // Character offset of trigger
  repeated EventArgument arguments = 5;  // Event arguments (participants)
  int32 sentence_index = 6;   // Index of the sentence this event belongs to
  bool is_main_event = 7;     // Whether this is the main event (vs. sub-event)
  repeated string sub_events = 8;  // IDs of sub-events under this main event
  repeated string source_relation_ids = 9;  // Source relation IDs (traceability: Event ← Relation)
  float confidence = 10;       // [0, 1]
  string source = 11;         // Extraction source, e.g. "relation_cluster"
}

// ---------------------------------------------------------------------------
// Title
// ---------------------------------------------------------------------------

message Title {
  string title_text = 1;       // Generated title text
  string method = 2;           // e.g. "entity_composition", "textrank_truncate"
  string mode = 3;             // "chars" or "ratio"
  int32 target_chars = 4;     // Target character count
  float target_ratio = 5;     // Target ratio of original text
  int32 source_sentence_index = 6;  // Source sentence index (-1 if composed)
  string source_text = 7;     // Source sentence text
  float score = 8;            // Importance score
  repeated string entities_used = 9;   // Entity texts used
  repeated string predicates_used = 10; // Predicate types used
  repeated string reasons = 11;        // Human-readable reasons
}
